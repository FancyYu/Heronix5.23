# MindBloom · Dify Chatflow 完整配置
# 使用方式：在 Dify 工作区 → 导入 DSL 文件
# 注意：导入后需手动配置 LLM 节点的模型密钥和知识库关联

app:
  description: MindBloom 神经多样性陪伴 AI Agent
  icon: 🧠
  icon_background: "#E8F5E9"
  mode: chat-flow
  name: MindBloom Agent
  showcase_agents: []

kind: app
version: 0.1.2
workflow:
  conversation_variables:
    - id: user_id
      type: text-input
      max_length: 64
      required: true
      label: 用户 ID
    - id: user_profile
      type: json
      label: 用户画像缓存
    - id: current_status
      type: json
      label: 当前状态缓存
    - id: chat_history_summary
      type: text-input
      label: 历史摘要
  features:
    file_upload:
      image:
        enabled: false
  graph:
    nodes:
      # ============================================================
      # 1. 开始节点
      # ============================================================
      - id: start
        type: start
        data:
          title: 开始
          type: start
          variables:
            - variable: sys_user_id
              label: 用户 ID
              options: []
              type: text-input
              max_length: 64
              required: true
            - variable: sys_current_task
              label: 当前任务（可选）
              options: []
              type: text-input
              max_length: 256
              required: false

      # ============================================================
      # 2. 变量赋值：从会话变量中读取
      # ============================================================
      - id: variable_assignment
        type: variable_assigner
        data:
          title: 赋值会话变量
          type: variable_assigner
          output_type:
          variables:
            - variable_selector:
                - conversation_variables
                - user_id
              input_selector:
                - start
                - sys_user_id

      # ============================================================
      # 3. HTTP Request：加载用户画像
      # ============================================================
      - id: http_get_user
        type: http_request
        data:
          title: 加载用户画像
          type: http_request
          method: get
          url: http://localhost:8000/users/{{#sys_user_id#}}
          authorization:
            type: no-auth
          headers: '{"Content-Type": "application/json"}'
          body:
          body_type: none
          outputs:
            - type: json
              children: []
          memory: null
          timeout: 5000
          retry:
            max_retries: 1
            retry_interval: 1000

      # ============================================================
      # 4. HTTP Request：加载当前状态
      # ============================================================
      - id: http_get_status
        type: http_request
        data:
          title: 加载当前状态
          type: http_request
          method: get
          url: http://localhost:8000/status/{{#sys_user_id#}}/latest
          authorization:
            type: no-auth
          headers: '{"Content-Type": "application/json"}'
          body:
          body_type: none
          outputs:
            - type: json
              children: []
          memory: null
          timeout: 5000
          retry:
            max_retries: 1
            retry_interval: 1000

      # ============================================================
      # 5. LLM：意图识别 Agent（路由层）
      # ============================================================
      - id: llm_intent_classifier
        type: llm
        data:
          title: 意图识别 Agent
          type: llm
          memory:
            role_prefix:
              assistant: ""
              user: ""
          context:
            enabled: false
            variable_selector: null
          model:
            completion_params:
              max_tokens: 64
              temperature: 0.1
              stop: []
            mode: chat
            name: deepseek-chat
            provider: openai_api_compatible
          prompt_template:
            - role: system
              text: |
                你是 MindBloom 的意图识别专家。你的任务是根据用户输入、用户画像和当前状态，判断用户当前最需要的 Agent 类型。

                ## 用户画像

                - 沟通偏好：{{#http_get_user.body.communication_style#}}
                - 能量模式：{{#http_get_user.body.energy_pattern#}}
                - 常见困难：{{#http_get_user.body.common_challenges#}}

                ## 用户当前状态

                - 能量值：{{#http_get_status.body.energy_level#}}/10
                - 情绪：{{#http_get_status.body.mood#}}
                - 专注值：{{#http_get_status.body.focus_level#}}/10
                - 感官负荷：{{#http_get_status.body.sensory_load#}}

                ## 用户输入

                {{#sys_user_id#}}  # 实际 Dify 中需改为 query 变量

                ## 输出规则

                输出以下四种 intent 之一，只输出标签本身，不要有其他内容：

                - **explore**：用户需要探索兴趣、寻找方向、推荐活动、理解自己（关键词：无聊、不知道做什么、好奇、迷茫、我想了解、为什么我会、这是什么意思）
                - **initiate**：用户需要启动任务、克服拖延、拆解步骤（关键词：动不了、卡住了、拖延、怎么开始、帮我拆、做不下去）
                - **focus**：用户需要专注支持、管理注意力、节奏控制（关键词：专注、学习、分心、走神、集中不了、工作、番茄钟）
                - **crisis**：用户处于高风险状态，需要安全降级（关键词：崩溃、活不下去、绝望、想死、受不了了、失控）

                ## 判断原则

                1. 同样的话在不同状态下意图不同。例如"我好累"：如果能量低且无任务压力 → explore；如果有 deadline → initiate
                2. 优先判断 crisis，再判断其他
                3. 不确定时，默认选择 explore（最安全的选项）

                ## 输出示例

                explore
            - role: user
              text: "{{#sys_user_id#}}"
          outputs:
            - type: text
              children: []
          variables: []

      # ============================================================
      # 6. Switch：根据 intent 分发
      # ============================================================
      - id: switch_router
        type: if_else
        data:
          title: 路由分发
          type: if_else
          cases:
            - case_id: explore
              logical_operator: and
              conditions:
                - comparison_operator: contains
                  id: explore_case
                  value_selector:
                    - llm_intent_classifier
                    - text
                  words:
                    - explore
                  variabel_selector: null
            - case_id: initiate
              logical_operator: and
              conditions:
                - comparison_operator: contains
                  logical_operator: and
                  id: initiate_case
                  value_selector:
                    - llm_intent_classifier
                    - text
                  words:
                    - initiate
                  variabel_selector: null
            - case_id: focus
              logical_operator: and
              conditions:
                - comparison_operator: contains
                  logical_operator: and
                  id: focus_case
                  value_selector:
                    - llm_intent_classifier
                    - text
                  words:
                    - focus
                  variabel_selector: null
          default_case_id: explore_fallback

      # ============================================================
      # 7. 探索 Agent（内驱力）
      # ============================================================
      - id: llm_explore_agent
        type: llm
        data:
          title: 探索 Agent（内驱力）
          type: llm
          memory:
            role_prefix:
              assistant: ""
              user: ""
          context:
            enabled: true
            variable_selector:
              - conversation_variables
              - chat_history_summary
          model:
            completion_params:
              max_tokens: 1024
              temperature: 0.75
              stop: []
            mode: chat
            name: deepseek-chat
            provider: openai_api_compatible
          prompt_template:
            - role: system
              text: |
                你是 MindBloom 的探索伙伴。你的任务是帮助用户探索自己的内在驱动力、理解自己的模式、发现新的可能性。

                ## 用户画像

                - 沟通偏好：{{#http_get_user.body.communication_style#}}
                - 能量模式：{{#http_get_user.body.energy_pattern#}}
                - 常见困难：{{#http_get_user.body.common_challenges#}}

                ## 用户当前状态

                - 能量值：{{#http_get_status.body.energy_level#}}/10
                - 情绪：{{#http_get_status.body.mood#}}
                - 专注值：{{#http_get_status.body.focus_level#}}/10

                ## 核心原则

                1. **不下定义、不诊断**。永远不说"你是XX型人""你属于XX"。只说"有些人发现...你觉得像吗？"
                2. **从具体经历出发**。不问"你的兴趣是什么"，问"最近一次忘记时间是在做什么？"
                3. **优先引导而非告知**。用问题引导用户自己发现，而不是直接给答案。

                ## 你的能力

                1. **知识库检索**：当用户问"有什么方法/理论/模型可以帮助我"时，从知识库中检索相关内容
                2. **兴趣挖掘**：基于用户的回答，记录和提炼兴趣模式
                3. **活动推荐**：根据用户当前能量，推荐合适的小活动

                ## 能量适配规则

                | 能量值 | 推荐活动类型 | 示例 |
                | ------ | ------------ | ---- |
                | 1-3 | 极低投入 | 看一张有趣的图、听30秒音乐、深呼吸一次 |
                | 4-6 | 中等投入 | 看一个短视频、读一段文章、做一个小手工 |
                | 7-10 | 深度投入 | 学习新技能、完成一个小项目、深入研究某个话题 |

                ## 回复格式

                1. 先回应用户的情绪
                2. 然后问一个问题，或提供一个选项
                3. 每次只给1-2个选项，不要太多

                ## 示例对话

                用户："我不知道自己喜欢什么"
                你："没关系，很多人一开始也说不清楚。我们换个方式问：最近一周，有没有哪个时刻你发现自己在做一件事，然后抬头一看，时间已经过去很久了？哪怕是很小的事。"

                ## 知识库使用规则

                当用户提到"有什么方法""有什么理论""心理学""认知模型""多巴胺""前额叶"等关键词时，主动从知识库检索相关内容。检索后用"有些人发现...""有一个理论说...你觉得和你的情况像吗？"的方式呈现。
            - role: user
              text: "{{#sys_user_id#}}"
          outputs:
            - type: text
              children: []
          variables: []

      # ============================================================
      # 8. 启动 Agent（行动力）
      # ============================================================
      - id: llm_initiate_agent
        type: llm
        data:
          title: 启动 Agent（行动力）
          type: llm
          memory:
            role_prefix:
              assistant: ""
              user: ""
          context:
            enabled: true
            variable_selector:
              - conversation_variables
              - chat_history_summary
          model:
            completion_params:
              max_tokens: 1024
              temperature: 0.7
              stop: []
            mode: chat
            name: deepseek-chat
            provider: openai_api_compatible
          prompt_template:
            - role: system
              text: |
                你是 MindBloom 的启动伙伴。你的任务是帮助用户克服启动困难，从"动不了"到"动起来"。

                ## 用户画像

                - 沟通偏好：{{#http_get_user.body.communication_style#}}
                - 常见困难：{{#http_get_user.body.common_challenges#}}

                ## 用户当前状态

                - 能量值：{{#http_get_status.body.energy_level#}}/10
                - 情绪：{{#http_get_status.body.mood#}}

                ## 核心原则

                1. **不责备、不评判**。永远不说"你应该""你怎么还没做""这很简单"。
                2. **先接纳，再引导**。"听起来你现在很难启动，这很常见。"
                3. **最小可执行**。把任务拆到"小到不可能失败"的程度。

                ## 你的能力

                1. **任务拆解**：把用户的任务拆成 1-2 分钟的微行动
                2. **策略推荐**：基于用户能量和历史有效策略，推荐启动方法
                3. **知识库检索**：当用户问"为什么我动不了"时，从知识库检索神经机制相关内容

                ## 微行动策略库（按优先级排序）

                1. **2分钟规则**："只做2分钟，2分钟后可以停。" 示例：只打开文档写标题
                2. **5秒法则**："倒数5-4-3-2-1，然后做第一个动作。" 倒数期间不思考
                3. **身体先行**："打个响指然后站起来""站起来伸个懒腰"
                4. **锚定任务**：先用一个极低门槛的任务带起主线任务
                5. **计时压力**："设置2分钟倒计时，只做2分钟"

                ## 能量适配规则

                | 能量值 | 推荐策略 |
                | ------ | -------- |
                | 1-3 | 不建议做任务。优先推荐恢复 |
                | 4-6 | 2分钟规则 + 计时压力 |
                | 7-10 | 任务拆解 + 锚定任务 |

                ## 回复格式

                1. 确认状态："听起来你现在很难启动"
                2. 推荐策略（1个，不要多选）
                3. 提供具体动作
                4. 结束时问："你想试试吗？"
            - role: user
              text: "{{#sys_user_id#}}"
          outputs:
            - type: text
              children: []
          variables: []

      # ============================================================
      # 9. 专注 Agent（注意力）
      # ============================================================
      - id: llm_focus_agent
        type: llm
        data:
          title: 专注 Agent（注意力）
          type: llm
          memory:
            role_prefix:
              assistant: ""
              user: ""
          context:
            enabled: true
            variable_selector:
              - conversation_variables
              - chat_history_summary
          model:
            completion_params:
              max_tokens: 1024
              temperature: 0.7
              stop: []
            mode: chat
            name: deepseek-chat
            provider: openai_api_compatible
          prompt_template:
            - role: system
              text: |
                你是 MindBloom 的专注伙伴。你的任务是帮助用户管理注意力，从"容易分心"到"能维持一段专注"。

                ## 用户画像

                - 沟通偏好：{{#http_get_user.body.communication_style#}}

                ## 用户当前状态

                - 能量值：{{#http_get_status.body.energy_level#}}/10
                - 专注值：{{#http_get_status.body.focus_level#}}/10

                ## 核心原则

                1. **不责备分心**。永远不说"你怎么又走神了"。说"注意力被拉走了，这很正常，我们回来就好。"
                2. **先短后长**。从短专注开始，慢慢延长。
                3. **允许走神**。记录走神的内容，但温和引导回来。

                ## 专注时长推荐规则

                | 专注值 | 推荐时长 | 说明 |
                | ------ | -------- | ---- |
                | 1-3 | 5分钟 | 极短专注，目标只是"开始" |
                | 4-6 | 10-15分钟 | 短专注，完成后可以休息 |
                | 7-10 | 25分钟（标准番茄钟） | 标准专注，完成后休息5分钟 |

                ## 专注前准备

                每次专注开始前，让用户设定一个"极小目标"：
                "这5分钟，我只做一件事：______"

                ## 分心处理

                当用户说"我分心了/走神了"：
                1. 不责备："注意力被拉走很正常。"
                2. 记录（可选）："刚才在想什么？可以简单记一下。"
                3. 温和回归："我们现在回来，再试2分钟？"

                ## 回复格式

                1. 确认当前状态
                2. 推荐专注时长 + 极小目标
                3. 问："现在开始吗？"
            - role: user
              text: "{{#sys_user_id#}}"
          outputs:
            - type: text
              children: []
          variables: []

      # ============================================================
      # 10. 安全降级：预设回复（不用 LLM）
      # ============================================================
      - id: code_crisis_response
        type: code
        data:
          title: 安全降级回复
          type: code
          code: |
            def main(input: dict) -> dict:
                return {
                    "reply": (
                        "我感受到了你现在很难受。你不需要一个人面对这些。\n\n"
                        "以下资源可能对你有帮助：\n"
                        "• 全国24小时心理援助热线：010-82951332\n"
                        "• 希望24热线（北京）：400-161-9995\n"
                        "• 简单心理/安顿等APP可在线预约咨询师\n\n"
                        "我不太确定我能在这件事上帮到你，但我希望你能联系专业的人。"
                        "你愿意让我帮你记下来，等你状态好一些再聊别的吗？"
                    )
                }
          outputs:
            - type: text
              children: []
          variables: []

      # ============================================================
      # 11. HTTP Request：记录行为（各分支共享子流程）
      # ============================================================
      - id: http_post_action_explore
        type: http_request
        data:
          title: 记录探索行为
          type: http_request
          method: post
          url: http://localhost:8000/actions
          authorization:
            type: no-auth
          headers: '{"Content-Type": "application/json"}'
          body:
            type: json
            data: '{"user_id": "{{#sys_user_id#}}", "agent_type": "explore", "action_type": "exploration", "content": "探索对话完成", "status": "active"}'
          outputs:
            - type: json
              children: []
          memory: null
          timeout: 5000
          retry:
            max_retries: 0
            retry_interval: 0

      - id: http_post_action_initiate
        type: http_request
        data:
          title: 记录启动行为
          type: http_request
          method: post
          url: http://localhost:8000/actions
          authorization:
            type: no-auth
          headers: '{"Content-Type": "application/json"}'
          body:
            type: json
            data: '{"user_id": "{{#sys_user_id#}}", "agent_type": "initiate", "action_type": "task_breakdown", "content": "启动支持对话完成", "status": "active"}'
          outputs:
            - type: json
              children: []
          memory: null
          timeout: 5000
          retry:
            max_retries: 0
            retry_interval: 0

      - id: http_post_action_focus
        type: http_request
        data:
          title: 记录专注行为
          type: http_request
          method: post
          url: http://localhost:8000/actions
          authorization:
            type: no-auth
          headers: '{"Content-Type": "application/json"}'
          body:
            type: json
            data: '{"user_id": "{{#sys_user_id#}}", "agent_type": "focus", "action_type": "focus_session", "content": "专注支持对话完成", "status": "active"}'
          outputs:
            - type: json
              children: []
          memory: null
          timeout: 5000
          retry:
            max_retries: 0
            retry_interval: 0

      - id: http_post_action_crisis
        type: http_request
        data:
          title: 记录危机事件
          type: http_request
          method: post
          url: http://localhost:8000/actions
          authorization:
            type: no-auth
          headers: '{"Content-Type": "application/json"}'
          body:
            type: json
            data: '{"user_id": "{{#sys_user_id#}}", "agent_type": "crisis", "action_type": "crisis_detected", "content": "危机状态触发安全降级", "status": "completed"}'
          outputs:
            - type: json
              children: []
          memory: null
          timeout: 5000
          retry:
            max_retries: 0
            retry_interval: 0

      # ============================================================
      # 12. 状态更新（可选，每个分支结束后）
      # ============================================================
      - id: http_update_status
        type: http_request
        data:
          title: 更新状态
          type: http_request
          method: post
          url: http://localhost:8000/status
          authorization:
            type: no-auth
          headers: '{"Content-Type": "application/json"}'
          body:
            type: json
            data: '{"user_id": "{{#sys_user_id#}}", "energy_level": 5, "mood": "calm", "focus_level": 5, "sensory_load": "comfortable", "context": "alone"}'
          outputs:
            - type: json
              children: []
          memory: null
          timeout: 5000
          retry:
            max_retries: 0
            retry_interval: 0

      # ============================================================
      # 13. Answer 节点（各分支的输出）
      # ============================================================
      - id: answer_explore
        type: answer
        data:
          title: 探索回复
          type: answer
          answer: "{{#llm_explore_agent.text#}}"

      - id: answer_initiate
        type: answer
        data:
          title: 启动回复
          type: answer
          answer: "{{#llm_initiate_agent.text#}}"

      - id: answer_focus
        type: answer
        data:
          title: 专注回复
          type: answer
          answer: "{{#llm_focus_agent.text#}}"

      - id: answer_crisis
        type: answer
        data:
          title: 安全降级回复
          type: answer
          answer: "{{#code_crisis_response.reply#}}"

      - id: answer_fallback
        type: answer
        data:
          title: 默认回复（fallback）
          type: answer
          answer: "你好，我是 MindBloom。今天感觉怎么样？想聊些什么？"

    edges:
      # 开始 → 变量赋值
      - source: start
        target: variable_assignment
        id: edge_start_to_var
        sourceHandle: start-source
        targetHandle: variable_assignment-target

      # 变量赋值 → HTTP 加载用户
      - source: variable_assignment
        target: http_get_user
        id: edge_var_to_user
        sourceHandle: variable_assignment-source
        targetHandle: http_get_user-target

      # 加载用户 → 加载状态
      - source: http_get_user
        target: http_get_status
        id: edge_user_to_status
        sourceHandle: http_get_user-source
        targetHandle: http_get_status-target

      # 加载状态 → 意图识别
      - source: http_get_status
        target: llm_intent_classifier
        id: edge_status_to_intent
        sourceHandle: http_get_status-source
        targetHandle: llm_intent_classifier-target

